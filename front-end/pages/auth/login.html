<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DT Hotel - Đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* --- RESET CSS CƠ BẢN --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- BỐ CỤC CHIA ĐÔI MÀN HÌNH --- */
        .login-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Bên trái: Chứa Logo (Chiếm 50% màn hình) */
        .left-side {
            flex: 0 0 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .logo-wrapper {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Bên phải: Chứa Form đăng nhập (Chiếm 50% màn hình) */
        .right-side {
            flex: 0 0 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #ffffff;
        }

        .form-box {
            width: 100%;
            max-width: 400px;
        }

        /* --- TIÊU ĐỀ --- */
        .form-header h2 {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 16px;
            color: #555555;
            margin-bottom: 35px;
        }

        /* --- Ô NHẬP LIỆU (INPUT) --- */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a3673;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Icon ổ khóa */
        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #a0a0a0;
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        /* Đẩy chữ qua phải ở ô Mật khẩu vì có icon */
        .input-wrapper.has-icon input {
            padding-left: 42px;
        }

        .input-wrapper input:focus {
            border-color: #1a3673;
        }

        .input-wrapper input::placeholder {
            color: #c0c0c0;
        }

        /* --- LINK QUÊN MẬT KHẨU --- */
        .forgot-password {
            text-align: right;
            margin-top: -12px;
            margin-bottom: 25px;
        }

        .forgot-password a {
            font-size: 13px;
            font-weight: 600;
            color: #1a3673;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* --- HỆ THỐNG NÚT BẤM (BUTTONS) --- */
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary {
            background-color: #224083;
            color: #ffffff;
            border: none;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            background-color: #183063;
        }

        .btn-secondary {
            background-color: transparent;
            color: #224083;
            border: 1px solid #224083;
            display: block;
        }

        .btn-secondary:hover {
            background-color: #f4f6fa;
        }

        /* --- ĐƯỜNG GẠCH NGANG CHỮ "HOẶC" --- */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="left-side">
            <div class="logo-wrapper">
                <img src="/assets/images/logo.png" alt="DT Hotel Logo">
            </div>
        </div>
        <div class="right-side">
            <div class="form-box">
                <div class="form-header">
                    <h2>Xin Chào</h2>
                    <p>Đăng nhập để tiếp tục</p>
                </div>
                <form action="#" method="POST" id="loginForm">
                    <div class="input-group">
                        <label for="username">Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="username" placeholder="Nhập email của bạn">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="password">Mật khẩu</label>
                        <div class="input-wrapper has-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Mật khẩu" required>
                        </div>
                    </div>
                    <div class="forgot-password">
                        <a href="forgotpass.html">Quên mật khẩu</a>
                    </div>
                    <button type="submit" class="btn btn-primary">Đăng nhập</button>
                    <div class="divider">hoặc</div>
                    <a href="SignUp.html" class="btn btn-secondary">Tạo tài khoản</a>
                </form>
            </div>
        </div>
    </div>
    <script src="/assets/js/api.js"></script> 
    <script src="/assets/js/auth.js"></script>
</body>
</html>
