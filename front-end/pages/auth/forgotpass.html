<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DT Hotel - Khôi phục mật khẩu</title>
    <style>
        /* --- RESET CSS CƠ BẢN --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
        }

        /* --- BỐ CỤC CHIA ĐÔI MÀN HÌNH --- */
        .recovery-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Bên trái: Khung chứa Logo (Chiếm 50% màn hình) */
        .left-side {
            flex: 0 0 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .logo-wrapper {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Bên phải: Khung chứa Form (Chiếm 50% màn hình) */
        .right-side {
            flex: 0 0 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #ffffff;
        }

        .form-box {
            width: 100%;
            max-width: 420px;
            /* Độ rộng tiêu chuẩn cho form nhập liệu */
        }

        /* --- TIÊU ĐỀ --- */
        .form-header h2 {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 25px;
            /* Khoảng cách xuống ô input đầu tiên rộng hơn chút */
        }

        /* --- Ô NHẬP LIỆU (INPUT) --- */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a3673;
            /* Màu xanh thương hiệu */
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #1a3673;
        }

        .input-wrapper input::placeholder {
            color: #c0c0c0;
        }

        /* Định vị icon cho ô Mật khẩu */
        .input-wrapper .icon-left {
            position: absolute;
            left: 15px;
            color: #a0a0a0;
            font-size: 16px;
        }

        .input-wrapper .icon-right {
            position: absolute;
            right: 15px;
            color: #a0a0a0;
            font-size: 16px;
            cursor: pointer;
        }

        /* Đẩy chữ sang hai bên khi ô input có chứa icon */
        .input-wrapper.has-icons input {
            padding-left: 42px;
            padding-right: 42px;
        }

        /* --- KHU VỰC NÚT BẤM (BUTTONS) --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Căn giữa các nút theo chiều ngang của form */
            gap: 15px;
            /* Khoảng cách giữa nút Xác nhận và Trở về */
            margin-top: 35px;
        }

        .btn {
            width: 220px;
            /* Thu nhỏ chiều rộng nút bấm lại chuẩn theo thiết kế ảnh */
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
        }

        /* Nút Xác nhận (Màu xanh đậm) */
        .btn-primary {
            background-color: #224083;
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #183063;
        }

        /* Nút Trở về (Viền xanh chữ xanh) */
        .btn-secondary {
            background-color: transparent;
            color: #224083;
            border: 1px solid #224083;
        }

        .btn-secondary:hover {
            background-color: #f4f6fa;
        }
    </style>
</head>
<body>
    <div class="recovery-container">
        <div class="left-side">
            <div class="logo-wrapper">
                <img src="/assets/images/logo.png" alt="DT Hotel Logo">
            </div>
        </div>
        <div class="right-side">
            <div class="form-box">
                <div class="form-header">
                    <h2>Khôi phục mật khẩu</h2>
                </div>
                <form action="#" method="POST" id="phoneForm">
                    <div class="input-group">
                        <label for="phone">Số điện thoại</label>
                        <div class="input-wrapper">
                            <input type="tel" id="phone" name="phone" placeholder="Số điện thoại" required>
                        </div>
                    </div>
                    <div class="btn-container">
                        <button type="submit" class="btn btn-primary">Xác nhận</button>

                        <button type="button" class="btn btn-secondary" onclick="window.location.href='login.html';">Trở
                            về</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <script src="/assets/js/api.js"></script> 
    <script src="/assets/js/auth.js"></script>
</body>

</html>
