<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Phòng</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; }
        .form-grid .form-group { margin:0; }
        input[readonly] { background:#f4f6fb; color:#888; cursor:not-allowed; }
        #room-id-display { font-weight:700; color:#1a3a6e; }
        .status-badge { display:inline-block; padding:3px 11px; border-radius:20px; font-size:12px; font-weight:600; }
        .badge-available   { background:#e6f9ee; color:#1a7a3a; }
        .badge-booked      { background:#fff4e0; color:#b06500; }
        .badge-occupied    { background:#fde8e8; color:#c0392b; }
        .badge-maintenance { background:#f0f0f0; color:#666; }
        tr.row-selected td { background:#e8f0fb !important; }
        tr[data-id]:hover td { background:#f0f5ff; cursor:pointer; }
        .hint { font-size:11px; color:#999; margin-top:3px; }
    </style>
</head>
<body class="admin-page">
<header class="header">
    <div class="logo2"><img src="/assets/images/logo2.svg" alt="DT Hotel Logo"></div>
    <nav class="navbar">
        <div class="menu-item" id="auth-container" style="position:relative;cursor:pointer;">
            <span class="icon"><img src="/assets/images/TaiKhoan2.svg" alt=""></span>
            <div id="auth-content"></div>
            <div id="logout-dropdown" style="display:none;position:absolute;top:100%;right:0;background:white;border:1px solid #ddd;border-radius:4px;box-shadow:0 4px 8px rgba(0,0,0,.1);width:120px;text-align:center;z-index:1000;">
                <p id="btn-logout" style="padding:10px;margin:0;color:#ff4d4d;font-weight:bold;cursor:pointer;">Đăng xuất</p>
            </div>
        </div>
        <div class="menu-item">
            <span class="icon"><img src="/assets/images/history2.svg" alt=""></span>
            <div><p>Lịch sử</p><p class="sub-text">thuê phòng</p></div>
        </div>
    </nav>
</header>

<div class="Main-content">
    <aside class="sidebar">
        <div class="sidebar-title">Quản Lý Khách Sạn</div>
        <nav class="sidebar-nav">
            <a href="QuanLyPhong.html"    class="nav-item active">Quản lý phòng</a>
            <a href="QuanLyKhachHang.html" class="nav-item">Quản lý khách hàng</a>
            <a href="QuanLyTaiKhoan.html"  class="nav-item">Quản lý tài khoản</a>
            <a href="LichSuDatPhong.html"  class="nav-item">Lịch sử đặt phòng</a>
            <a href="ThongKeThuNhap.html"  class="nav-item">Thống kê thu nhập</a>
            <a href="/pages/customer/Trangchu.html" class="nav-item"
               style="margin-top:16px;background:#e8f0fb;color:#204080;border-color:#204080;display:flex;align-items:center;gap:7px;font-weight:700;">
                &#128065; Xem trang khách hàng
            </a>
        </nav>
    </aside>

    <main class="content">
        <!-- Form CRUD -->
        <section class="form-container">
            <input type="hidden" id="room-id-hidden">
            <div class="form-grid">
                <div class="form-group">
                    <label for="room-number">Số phòng:</label>
                    <input type="text" id="room-number" placeholder="VD: A101, B205...">
                    <div class="hint" id="room-id-display"></div>
                </div>
                <div class="form-group">
                    <label for="room-type">Kiểu phòng:</label>
                    <select id="room-type" onchange="onRoomTypeChange()">
                        <option value="">-- Chọn kiểu phòng --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="room-price">Giá phòng:</label>
                    <input type="text" id="room-price" readonly placeholder="Tự động theo kiểu phòng">
                </div>
                <div class="form-group">
                    <label for="room-status">Tình trạng:</label>
                    <select id="room-status">
                        <option value="AVAILABLE">Còn trống</option>
                        <option value="BOOKED">Đã đặt</option>
                        <option value="OCCUPIED">Đang ở</option>
                        <option value="MAINTENANCE">Bảo trì</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Action bar -->
        <section class="action-bar">
            <div class="btn-group">
                <button id="btn-them"     class="btn btn-blue">Thêm</button>
                <button id="btn-capnhat"  class="btn btn-blue">Cập Nhật</button>
                <button id="btn-xoa"      class="btn btn-blue">Xóa</button>
            </div>
            <div class="search">
                <label>Tìm kiếm</label>
                <input type="text" id="searchRoom" oninput="filterRooms()"
                       placeholder="Nhập mã phòng hoặc tên phòng...">
            </div>
        </section>

        <!-- Table -->
        <section class="table-container">
            <h3 class="table-title">Danh sách phòng</h3>
            <table class="data-table" id="roomTable">
                <thead>
                    <tr>
                        <th>Mã phòng</th>
                        <th>Tên phòng</th>
                        <th>Kiểu phòng</th>
                        <th>Giá phòng</th>
                        <th>Tình trạng</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="text-align:center;color:#999">Đang tải...</td></tr>
                </tbody>
            </table>
        </section>
    </main>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
